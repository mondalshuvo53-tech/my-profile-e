<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subrata's 8D Analytics - Nano Water</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: #050a14; color: #ffffff; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; background-image: radial-gradient(circle at 50% 0%, #002233 0%, #000a14 60%); }
        
        /* SEE MORE MENU STYLES */
        .menu-container { position: fixed; top: 30px; right: 40px; z-index: 99999; font-family: 'Segoe UI', sans-serif;}
        .see-more-btn { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .see-more-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); border: 1px solid #00f3ff; }
        .dropdown-menu { display: none; position: absolute; top: 60px; right: 0; background: rgba(10, 15, 30, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; min-width: 220px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.8); flex-direction: column; }
        .dropdown-menu.show { display: flex; }
        .dropdown-menu a { color: white; padding: 16px 20px; text-decoration: none; font-size: 15px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .dropdown-menu a:hover { background: rgba(255, 255, 255, 0.1); color: #00f3ff; padding-left: 25px; }

        .scene { perspective: 1500px; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; z-index: 1; }
        .stack-container { position: relative; width: 750px; height: 450px; transform-style: preserve-3d; transform: translate(-150px, -100px); }
        .card { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backdrop-filter: blur(25px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; transition: transform 1.2s cubic-bezier(0.2,0.8,0.2,1), opacity 1.2s, box-shadow 1.2s, background 1.5s; overflow: hidden; }
        .card.active { box-shadow: 0 40px 80px -15px rgba(0,0,0,0.9), 0 0 60px rgba(255,0,255,0.4); border: 1px solid rgba(255,255,255,0.6); }
        .card:not(.active) { box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .header { padding: 25px 40px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, rgba(255,255,255,0.15), transparent); }
        .header h2 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(90deg, #fff, #ffb6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .slide-counter { font-size: 1rem; font-weight: 700; background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); }
        .content { padding: 30px 40px; flex-grow: 1; display: flex; gap: 40px; align-items: center; }
        .player-img { width: 250px; height: 250px; border-radius: 12px; object-fit: contain; border: 3px solid rgba(255,255,255,0.9); background: rgba(0,0,0,0.5); }
        .stats-grid { flex-grow: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-item { display: flex; flex-direction: column; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); }
        .stat-label { font-size: 0.85rem; color: #e0f7fa; text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 1.6rem; font-weight: 800; color: #fff; }
        .progress-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 400px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 6px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff00ff, #00d4ff); transition: width 1.2s; box-shadow: 0 0 15px rgba(255,0,255,0.8); }
    </style>
</head>
<body>

    <div class="menu-container">
        <button class="see-more-btn" onclick="toggleMenu()">☰ See More</button>
        <div class="dropdown-menu" id="myDropdown">
            <a href="index.html">🏢 Professional Base</a>
            <a href="ironman.html">🤖 Iron Man HUD</a>
            <a href="panther.html">🐆 Wakanda Panther</a>
            <a href="galaxy.html">🌌 Nano Water</a>
        </div>
    </div>

    <div class="scene"><div class="stack-container" id="stackContainer"></div></div>
    <div class="progress-container"><div class="progress-bar" id="progressBar" style="width: 0%"></div></div>

    <script>
        function toggleMenu() { document.getElementById("myDropdown").classList.toggle("show"); }
        window.onclick = function(e) { if (!e.target.matches('.see-more-btn')) { document.querySelectorAll('.dropdown-menu').forEach(d => d.classList.remove('show')); } }

        const playerData = [
            { name: "Subrata Mondal", match: 150, run: 1000, sr: 160, born: "Indian", age: 37, imageLink: "https://drive.google.com/uc?export=view&id=1oJrTStNk9CbqUHTgOfVkLwy5Svk76B_k" },
            { name: "Neripan Biswea", match: 145, run: 980,  sr: 155, born: "Indian", age: 34, imageLink: "https://drive.google.com/uc?export=view&id=1N9gvX1zQkpxdo4bamBzQwtddGZVo99Xl" },
            { name: "Ramesh Majhi",   match: 130, run: 850,  sr: 140, born: "Indian", age: 32, imageLink: "https://drive.google.com/uc?export=view&id=168SlcDssnLqojkxcqVMcBOWcRsiBAheU" },
            { name: "Krishna Biswas", match: 160, run: 1100, sr: 165, born: "Indian", age: 35, imageLink: "https://drive.google.com/uc?export=view&id=12jj_sp_I6fcWQ253QcQCicI-5zMcEXKu" },
            { name: "Nobin Biswas",   match: 120, run: 700,  sr: 135, born: "Indian", age: 30, imageLink: "" },
            { name: "Santanu Biswas", match: 140, run: 900,  sr: 150, born: "Indian", age: 33, imageLink: "https://drive.google.com/uc?export=view&id=19xp64lRFOQSvY0rm4Q2S2p5VIqRjuL_Y" },
            { name: "Ratan Roy",      match: 110, run: 600,  sr: 125, born: "Indian", age: 29, imageLink: "https://drive.google.com/uc?export=view&id=1ITWjWD7Xg8QS3eNclWAu4zExVCdGW7nK" },
            { name: "Sanjiv Shaw",    match: 175, run: 1250, sr: 170, born: "Indian", age: 38, imageLink: "https://drive.google.com/uc?export=view&id=1JIVaIU-Ox6xrGqqzH5M_bkfiY8ik_PGu" },
            { name: "Omeo Mity",      match: 105, run: 550,  sr: 120, born: "Indian", age: 28, imageLink: "https://drive.google.com/uc?export=view&id=1ESZnPHA_TaWmpeT1sHbmWXWwotk8Psr_" },
            { name: "Dabu Maity",     match: 135, run: 800,  sr: 145, born: "Indian", age: 31, imageLink: "https://drive.google.com/uc?export=view&id=11YHOXMU0eZUWyEWTUVVfON1PNgyjyAva" }
            // Add remaining 20 players below as needed
        ];

        const cardPalette = ['linear-gradient(135deg, rgba(255, 0, 128, 0.7), rgba(75, 0, 130, 0.85))', 'linear-gradient(135deg, rgba(0, 212, 255, 0.7), rgba(9, 9, 121, 0.85))', 'linear-gradient(135deg, rgba(138, 43, 226, 0.7), rgba(0, 0, 0, 0.85))', 'linear-gradient(135deg, rgba(255, 106, 0, 0.7), rgba(138, 43, 226, 0.85))'];

        const stack = document.getElementById('stackContainer');
        playerData.forEach((p, i) => {
            const card = document.createElement('div'); card.className = 'card'; card.style.background = cardPalette[i % cardPalette.length];
            const imgUrl = p.imageLink ? p.imageLink : `https://ui-avatars.com/api/?name=${p.name.replace(' ','+')}&background=0a0f1c&color=fff&size=250`;
            card.innerHTML = `<div class="header"><h2>${p.name}</h2><span class="slide-counter">${i+1}/${playerData.length}</span></div>
            <div class="content"><img src="${imgUrl}" class="player-img" onerror="this.src='https://ui-avatars.com/api/?name=${p.name.replace(' ','+')}&background=0a0f1c&color=fff'">
            <div class="stats-grid"><div class="stat-item"><span class="stat-label">Matches</span><span class="stat-value">${p.match}</span></div>
            <div class="stat-item"><span class="stat-label">Runs</span><span class="stat-value">${p.run}</span></div>
            <div class="stat-item"><span class="stat-label">Strike Rate</span><span class="stat-value">${p.sr}</span></div>
            <div class="stat-item"><span class="stat-label">Profile</span><span class="stat-value">${p.age} / ${p.born}</span></div></div></div>`;
            stack.appendChild(card);
        });

        const cards = document.querySelectorAll('.card');
        let current = 0; let animating = false;

        function update() {
            cards.forEach((c, i) => {
                const r = i - current;
                if (r < 0) { c.style.transform = `translate3d(-200px, -300px, 100px) scale(1.1)`; c.style.opacity = 0; c.style.zIndex = 100; c.classList.remove('active'); }
                else {
                    c.style.transform = `translate3d(${r*130}px, ${r*85}px, ${r*-180}px) scale(${Math.max(0, 1 - r*0.16)})`;
                    c.style.zIndex = 50 - r;
                    if(r===0) { c.style.opacity=1; c.classList.add('active'); } else { c.style.opacity = r>5?0:1; c.classList.remove('active'); }
                }
                c.style.visibility = (r > 6 || r < -1) ? 'hidden' : 'visible';
            });
            document.getElementById('progressBar').style.width = `${((current + 1)/playerData.length)*100}%`;
        }

        function trigger(dir) {
            if(animating) return;
            if(dir === 'next' && current < playerData.length - 1) current++; else if(dir === 'prev' && current > 0) current--; else return;
            animating = true; update(); setTimeout(()=>animating=false, 1200);
        }
        window.addEventListener('wheel', e => trigger(e.deltaY > 0 ? 'next' : 'prev'));
        let ts = 0; window.addEventListener('touchstart', e => ts = e.touches[0].clientY);
        window.addEventListener('touchend', e => { let d = ts - e.changedTouches[0].clientY; if(d>50) trigger('next'); else if(d<-50) trigger('prev'); });
        window.addEventListener('keydown', e => { if(e.key==='ArrowDown'||e.key==='ArrowRight') trigger('next'); if(e.key==='ArrowUp'||e.key==='ArrowLeft') trigger('prev'); });
        update();
    </script>
</body>
</html>
