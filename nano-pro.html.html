        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
        }

        .card-wrapper.flipped .card-inner { transform: rotateY(180deg); }
        .card-wrapper.flipped { z-index: 1000 !important; }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;

            display: flex; flex-direction: column; justify-content: center;

        const board = document.getElementById('board');
        const cardObjects = [];

        function createCards() {
            const containerWidth = board.offsetWidth;
            const containerHeight = board.offsetHeight;

            services.forEach((s) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';
                
                // Fixed random start within safe boundaries
                const state = {
                    x: Math.random() * (containerWidth - 170),
                    y: Math.random() * (containerHeight - 110),
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    isFlipped: false
                };

                wrapper.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="kw-tag">${s.kw}</div>
                            <div class="title-text">${s.title}</div>
                        </div>
                        <div class="card-back">
                            <div>${s.desc}</div>
                        </div>
                    </div>
                `;

                wrapper.onclick = () => {
                    state.isFlipped = !state.isFlipped;
                    wrapper.classList.toggle('flipped');
                };

                board.appendChild(wrapper);
                cardObjects.push({ el: wrapper, state });
            });
            requestAnimationFrame(update);
        }

        function update() {
            const w = board.offsetWidth;
            const h = board.offsetHeight;

            cardObjects.forEach(card => {
                if (!card.state.isFlipped) {
                    card.state.x += card.state.vx;
                    card.state.y += card.state.vy;

                    // Bounce logic for safe area
                    if (card.state.x <= 5 || card.state.x >= w - 165) card.state.vx *= -1;
                    if (card.state.y <= 5 || card.state.y >= h - 105) card.state.vy *= -1;

                    card.el.style.transform = `translate3d(${card.state.x}px, ${card.state.y}px, 0)`;
                }
            });
            requestAnimationFrame(update);
        }

        // Initialize and handle window resizing
        createCards();
        window.onresize = () => location.reload();
